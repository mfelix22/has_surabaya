version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: body-repair-surabaya
    ports:
      - "5050:80"
    volumes:
      - app_storage:/var/www/html/storage
      - app_database:/var/www/html/database
    environment:
      APP_NAME: "Body Repair"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:5050
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: body_repair
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: body-repair-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: body_repair
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "50306:3306"
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: body-repair-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5031:80"
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  app_storage:
  app_database:
  mysql_data:
